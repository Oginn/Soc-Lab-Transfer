ry."},{type:"warning",text:"If Test-Path returns False, stop immediately. You are on the wrong VM."}]},{id:6,title:"VERIFY SYSMON",blocks:[{type:"code",data:{code:"Get-Service Sysmon64",lang:"powershell",label:"PowerShell"}},{type:"p",text:"It should show:"},{type:"code",data:{code:`Status   Name       DisplayName

thon -m py_compile .\\collector\\sysmon.py",lang:"powershell",label:"PowerShell"}},{type:"code",data:{code:"python -m py_compile .\\collector\\detections.py",lang:"powershell",label:"PowerShell"}},{type:"p",text:"Each command should return to the PowerShell prompt without a Python error."}]},{id:13,title:"VERIFY THE DATABASE",blocks:[{type:"code",data:{code:"Test-Path C:\\SecurityLab\\data\\soc.db",lang:"powershell",label:"PowerShell"}},{type:"code",data:{code:`python -c "import sqlite3; c=sqlite3.connect(r'C:\\SecurityLab\\data\\soc.db'); print(c.execute('SELECT name FROM sqlite_master WHERE type=?', ('table',)).fetchall()); c.close()"`,lang:"powershell",label:"PowerShell"}},{type:"p",text:"You should see tables including hosts, events, process_events, network_events, dns_events, detections, alerts, investigations, investigation_events."},{type:"warning",text:"Do not manually change the database."}]},{id:14,title:"VERIFY THE FRONTEND",blocks:[{type:"code",data:{code:"deactivate",lang:"powershell",label:"PowerShell"}},{type:"code",data:{code:"cd C:\\SecurityLab\\frontend",lang:"powershell",label:"PowerShell"}},{type:"code",data:{code:"node --version",lang:"powershell",label:"PowerShell"}},{type:"code",data:{code:"npm --version",lang:"powershell",label:"PowerShell"}},{type:"p",text:"Our working environment uses Node.js 24.x and npm 11.x."},{type:"code",data:{code:"npm run build",lang:"powershell",label:"PowerShell"}},{type:"p",text:"The build must complete successfully. If the build succeeds, the frontend is ready for transfer."}]},{id:15,title:"VERIFY THAT package-lock.json EXISTS",blocks:[{type:"code",data:{code:"Test-Path C:\\SecurityLab\\frontend\\package-lock.json",lang:"powershell",label:"PowerShell"}},{type:"p",text:"Expected True. This file is important. It records the exact Node package dependency tree used by the frontend. We will use npm ci on the destination machine. That is preferable to randomly installing packages."}]},{id:16,title:"STOP THE SOC APPLICATIONS BEFORE COPYING",blocks:[{type:"p",text:"If the collector is running, go to its PowerShell window and press Ctrl+C. If FastAPI is running, press Ctrl+C. If Next.js is running, press Ctrl+C."},{type:"code",data:{code:"Ctrl+C",lang:"text"}},{type:"p",text:"We want the application stopped before making the portable copy."}]},{id:17,title:"MAKE A PORTABLE COPY",blocks:[{type:"p",text:"We will make a separate transfer copy."},{type:"code",data:{code:"New-Item -ItemType Directory -Path C:\\SOC-Transfer -Force",lang:"powershell",label:"PowerShell"}},{type:"code",data:{code:"robocopy C:\\SecurityLab C:\\SOC-Transfer\\SecurityLab /E",lang:"powershell",label:"PowerShell"}},{type:"p",text:"Wait until robocopy finishes. Do not remove anything while it is copying."}]},{id:18,title:"IMPORTANT — REMOVE THE OLD PYTHON ENVIRONMENT FROM THE TRANSFER COPY",blocks:[{type:"warning",title:"Critical",text:"The original .venv belongs to the original Windows installation. We will create a new one on the destination VM."},{type:"p",text:"Delete the .venv from the TRANSFER COPY only."},{type:"code",data:{code:"Remove-Item C:\\SOC-Transfer\\SecurityLab\\.venv -Recurse -Force",lang:"powershell",label:"PowerShell"}},{type:"p",text:"IMPORTANT: We are deleting C:\\SOC-Transfer\\SecurityLab\\.venv NOT C:\\SecurityLab\\.venv The original working laboratory remains untouched."}]},{id:19,title:"REMOVE node_modules FROM THE TRANSFER COPY",blocks:[{type:"p",text:"The destination machine will recreate the frontend packages using npm ci. Therefore remove node_modules from the transfer copy."},{type:"code",data:{code:"Remove-Item C:\\SOC-Transfer\\SecurityLab\\frontend\\node_modules -Recurse -Force -ErrorAction SilentlyContinue",lang:"powershell",label:"PowerShell"}},{type:"p",text:"This removes it only from C:\\SOC-Transfer. It does not remove the working frontend installation."}]},{id:20,title:"VERIFY THE TRANSFER PACKAGE",blocks:[{type:"code",data:{code:"Get-ChildItem C:\\SOC-Transfer\\SecurityLab",lang:"powershell",label:"PowerShell"}},{type:"p",text:"You should have backend, collector, data, frontend, requirements.txt. You should NOT need .venv and frontend\\node_modules. The transfer package is now portable."}]},{id:21,title:"CHECK THE SIZE OF THE TRANSFER PACKAGE",blocks:[{type:"code",data:{code:"(Get-ChildItem C:\\SOC-Transfer\\SecurityLab -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1GB",lang:"powershell",label:"PowerShell"}},{type:"p",text:"This gives the approximate size in GB. Make sure the flash drive has enough free space."}]},{id:22,title:"CONNECT THE FLASH DRIVE",blocks:[{type:"p",text:"Connect the USB/flash drive to the computer running the working VM. Windows should assign it a drive letter. For example E: Your drive letter may be different. DO NOT assume it is E:"},{type:"code",data:{code:"E:",lang:"text"}}]},{id:23,title:"FIND THE FLASH DRIVE LETTER",blocks:[{type:"code",data:{code:"Get-Volume",lang:"powershell",label:"PowerShell"}},{type:"p",text:"Look at the output. Find the removable drive."},{type:"code",data:{code:`DriveLetter FileSystemLabel

ing the transfer unless necessary."},{type:"warning",text:"Use identical Sysmon config on both VMs for consistent class results."}]},{id:75,title:"DATABASE DECISION",blocks:[{type:"p",text:"The procedure above copies C:\\SecurityLab\\data\\soc.db Therefore the destination receives the current database. That means existing events, detections, alerts, investigations, hosts may already be present."},{type:"p",text:"This is intentional if you want the second VM to contain the same class data. For a completely fresh endpoint database, that is a separate operation and should be done deliberately. Do NOT simply delete soc.db because the database schema is part of the application and we want to preserve the known-working system."}]},{id:76,title:"DO NOT CHANGE THE PROJECT PATH",blocks:[{type:"p",text:"Use C:\\SecurityLab on the destination. Do not install it as D:\\SecurityLab or C:\\Users\\Administrator\\Desktop\\SecurityLab or C:\\SOC. The safest approach is to keep the exact project path C:\\SecurityLab. This keeps the laboratory consistent with the system we built."},{type:"warning",text:"Keep path exactly C:\\SecurityLab to avoid breaking imports and configs."}]},{id:77,title:"FINAL PORTABLE LAB STRUCTURE",blocks:[{type:"p",text:"After successful installation, the destination should look like:"},{type:"diagram",text:`C:\\SecurityLab
